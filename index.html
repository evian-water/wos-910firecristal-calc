<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火晶計算ツール</title>

<style>
body{
    font-family:"Yu Gothic",sans-serif;
    max-width:900px;
    margin:0 auto;
    padding:10px;
    background:#f5f5f5;
}

h1{
    text-align:center;
    margin:10px 0 15px;
    font-size:1.5rem;
}

/* =====================
   固定サマリー
===================== */

.summary{
    position:sticky;
    top:0;
    z-index:1000;

    background:#f5f5f5;
    padding:8px 0 12px;
    margin-bottom:15px;
}

.summary-title{
    text-align:center;
    font-size:14px;
    font-weight:bold;
    color:#666;
    margin-bottom:8px;
}

.summary-row{
    display:flex;
    gap:8px;
}

.summary-card{
    flex:1;
    text-align:center;
    border-radius:12px;
    padding:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.crystal-card{
    background:#ffebee;
    border:2px solid #ef5350;
}

.refine-card{
    background:#e3f2fd;
    border:2px solid #42a5f5;
}

.summary-label{
    font-size:13px;
    font-weight:bold;
    margin-bottom:4px;
}

.total{
    font-weight:bold;
    line-height:1;
}

.crystal-total{
    color:#d32f2f;
    font-size:2rem;
}

.refine-total{
    color:#1976d2;
    font-size:2rem;
}

/* =====================
   ボタン
===================== */

.buttons{
    text-align:center;
    margin-bottom:15px;
}

button{
    padding:10px 18px;
    font-size:16px;
    cursor:pointer;
    margin:0 4px;
}

/* =====================
   項目
===================== */

.item{
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;

    padding:12px;
    margin-bottom:10px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.info{
    flex:1;
}

.label{
    font-weight:bold;
    font-size:18px;
    margin-bottom:8px;
}

.row{
    display:flex;
    gap:20px;
    line-height:1.8;
}

.name{
    width:90px;
    font-weight:bold;
}

.value{
    font-weight:bold;
}

.checkbox-area{
    padding-left:15px;
}

input[type="checkbox"]{
    width:28px;
    height:28px;
    cursor:pointer;
}

/* =====================
   スマホ
===================== */

@media (max-width:600px){

    body{
        padding:8px;
    }

    h1{
        font-size:1.2rem;
    }

    .summary-label{
        font-size:12px;
    }

    .crystal-total,
    .refine-total{
        font-size:1.8rem;
    }

    .label{
        font-size:16px;
    }

    .name{
        width:80px;
    }

    button{
        width:45%;
    }
}
</style>
</head>

<body>

<h1>火晶計算ツール</h1>

<div class="summary">

    <div class="summary-title">
        消費素材合計
    </div>

    <div class="summary-row">

        <div class="summary-card crystal-card">
            <div class="summary-label">
                火晶
            </div>
            <div class="total crystal-total" id="crystalTotal">
                0
            </div>
        </div>

        <div class="summary-card refine-card">
            <div class="summary-label">
                精錬火晶
            </div>
            <div class="total refine-total" id="refineTotal">
                0
            </div>
        </div>

    </div>

</div>

<div class="buttons">
    <button type="button" onclick="checkAll()">全部ON</button>
    <button type="button" onclick="uncheckAll()">全部OFF</button>
</div>

<div id="container"></div>

<script>

const data = [
    {label:"大溶鉱炉(8→9)", crystal:1260, refine:180},
    {label:"大使館(8→9)", crystal:315, refine:43},
    {label:"司令部(8→9)", crystal:252, refine:36},
    {label:"兵舎盾(8→9)", crystal:567, refine:79},
    {label:"兵舎槍(8→9)", crystal:567, refine:79},
    {label:"兵舎弓(8→9)", crystal:567, refine:79},
    {label:"軍医所(8→9)", crystal:252, refine:36},
    {label:"戦争学園(8→9)", crystal:567, refine:79},

    {label:"大溶鉱炉(9→10)", crystal:1575, refine:420},
    {label:"大使館(9→10)", crystal:391, refine:103},
    {label:"兵舎盾(9→10)", crystal:706, refine:187},
    {label:"兵舎槍(9→10)", crystal:706, refine:187},
    {label:"兵舎弓(9→10)", crystal:706, refine:187},
    {label:"司令部(9→10)", crystal:315, refine:84},
    {label:"軍医所(9→10)", crystal:315, refine:84},
    {label:"戦争学園(9→10)", crystal:706, refine:187}
];

const container = document.getElementById("container");

data.forEach(item => {

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
        <div class="info">

            <div class="label">
                ${item.label}
            </div>

            <div class="row">
                <span class="name">火晶</span>
                <span class="value">${item.crystal.toLocaleString()}</span>
            </div>

            <div class="row">
                <span class="name">精錬火晶</span>
                <span class="value">${item.refine.toLocaleString()}</span>
            </div>

        </div>

        <div class="checkbox-area">
            <input
                type="checkbox"
                class="itemCheck"
                data-crystal="${item.crystal}"
                data-refine="${item.refine}"
                onchange="calculateTotal()">
        </div>
    `;

    container.appendChild(div);
});

function calculateTotal(){

    let crystalTotal = 0;
    let refineTotal = 0;

    document.querySelectorAll(".itemCheck").forEach(chk => {

        if(chk.checked){
            crystalTotal += Number(chk.dataset.crystal);
            refineTotal += Number(chk.dataset.refine);
        }

    });

    document.getElementById("crystalTotal").textContent =
        crystalTotal.toLocaleString();

    document.getElementById("refineTotal").textContent =
        refineTotal.toLocaleString();
}

function checkAll(){

    document.querySelectorAll(".itemCheck").forEach(chk => {
        chk.checked = true;
    });

    calculateTotal();
}

function uncheckAll(){

    document.querySelectorAll(".itemCheck").forEach(chk => {
        chk.checked = false;
    });

    calculateTotal();
}

calculateTotal();

</script>

</body>
</html>
